# Optional: review every PR in THIS repository with the agent itself (no GitHub App needed).
# Add a GROQ_API_KEY repository secret to enable it.
name: AI review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv pip install --system .
      - name: Review this PR
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pr-review github "${{ github.event.pull_request.html_url }}" --post || true
