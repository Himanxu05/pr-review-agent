name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check src tests eval
      - name: Tests
        run: pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t pr-reviewer .
      - name: Smoke test container
        run: |
          docker run -d -p 8000:8000 -e GITHUB_WEBHOOK_SECRET=x --name r pr-reviewer
          for i in $(seq 1 20); do curl -fs localhost:8000/health && exit 0; sleep 1; done
          docker logs r; exit 1
